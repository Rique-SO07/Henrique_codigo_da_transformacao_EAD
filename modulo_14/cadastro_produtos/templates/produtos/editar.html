<!DOCTYPE html>
<html>
<head><title>Editar Produto</title></head>
<body style="font-family: Arial; margin: 30px; background: #1e1e1e; color: #fff;">
    <h2>✏️ Editar Produto</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="nome" value="{{ produto.nome }}"><br><br>
        <textarea name="descricao">{{ produto.descricao }}</textarea><br><br>
        <input type="number" step="0.01" name="preco" value="{{ produto.preco }}"><br><br>
        <input type="number" name="quantidade" value="{{ produto.quantidade }}"><br><br>
        <button type="submit" style="background:#007acc; color:#fff; border:none; padding:10px;">Atualizar</button>
    </form>
</body>
</html>
